# ========================================================
# HYPRLOCK - X64 STUDIOS PREMIUM GLASSMORPHISM THEME
# ========================================================

background {
    monitor =
    path = /usr/share/omarchy/themes/x64-studios-default/backgrounds/default.png
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.1)
    inner_color = rgba(17, 24, 39, 0.7)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    placeholder_text = <i>Contraseña...</i>
    hide_input = false
    position = 0, -120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$TIME"
    color = rgba(255, 255, 255, 0.9)
    font_size = 120
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 150
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
}

label {
    monitor =
    text = X64 Studios
    color = rgba(200, 200, 200, 1.0)
    font_size = 25
    font_family = Inter Medium
    position = 0, 40
    halign = center
    valign = center
    shadow_passes = 1
}
