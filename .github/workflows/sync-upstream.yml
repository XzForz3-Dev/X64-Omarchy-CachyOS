name: "Auto-Sync Upstream (CI/CD Shield)"

on:
  schedule:
    - cron: '0 3 * * *' # 3:00 AM UTC todos los días
  workflow_dispatch: # Botón manual en la interfaz web

permissions:
  contents: write
  issues: write

jobs:
  sync_and_test:
    name: Sincronizar y Probar
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Repositorio (quattro)
        uses: actions/checkout@v4
        with:
          ref: quattro
          fetch-depth: 0

      - name: Configurar Git Bot
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global merge.ours.driver true

      - name: Conectar con Upstream (basecamp/omarchy)
        run: |
          git remote add upstream https://github.com/basecamp/omarchy.git
          git fetch upstream quattro

      - name: Fusión Estricta (Requerir Adaptación Manual)
        run: |
          # Hacemos merge. Si hay conflicto estructural con los cambios del creador, el comando fallará.
          # Esto activará el Escudo de Emergencia para que la IA y el usuario adapten el código.
          git merge upstream/quattro -m "chore: Auto-sync from upstream"

      - name: Ejecutar Pruebas de Integridad (CI)
        id: run_tests
        run: |
          # 1. Validar que la estructura principal de Python esté intacta
          python -m py_compile x64-install.py
          
          # 2. Validar sintaxis de Bash en los binarios críticos
          bash -n bin/omarchy-update
          bash -n x64-install.sh

      - name: Guardar y Subir Cambios (Push)
        if: success()
        run: |
          git push origin quattro

      - name: Escudo de Emergencia (Aviso de Fallo)
        if: failure()
        run: |
          echo "::error title=🚨 Escudo CI/CD: Actualización Oficial Rechazada::El robot intentó descargar las últimas actualizaciones de basecamp/omarchy y fusionarlas en la rama quattro. Sin embargo, hubo un conflicto de fusión (merge conflict) o las pruebas automáticas fallaron. Esto significa que los creadores originales hicieron cambios estructurales que chocan con nuestro código. La actualización se ha abortado completamente para proteger tu proyecto. Instrucciones: Muestra este problema a tu asistente IA (Antigravity) en el IDE para que pueda resolver el conflicto y adaptar nuestra arquitectura al nuevo código oficial."
          exit 1
